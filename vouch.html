<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a Vouch / Review - Kezrblx Marketplace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', Arial, sans-serif; }
  :root {
    --bg: #050706; --surface: #0a0f0d; --surface-soft: #111814;
    --border: #17221c; --border-light: #22332a; --text: #eef4f0;
    --muted: #7c8f85; --green: #00d564; --green-light: #00e676;
    --green-soft: rgba(0,213,100,.12); --danger: #ff5f56; --star: #ffbd2e;
  }
  body {
    background: radial-gradient(circle at top center, rgba(0,213,100,.06), transparent 40%), var(--bg);
    color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
  }
  
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    max-width: 480px; width: 100%; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    text-align: center; backdrop-filter: blur(10px);
  }
  
  .header-title { color: var(--green-light); font-size: 20px; font-weight: 900; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 0 0 15px rgba(0,213,100,0.2); }
  .header-subtitle { color: var(--muted); font-size: 11px; margin-bottom: 24px; font-weight: 500; }

  .form-group { margin-bottom: 16px; text-align: left; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 9px; color: var(--muted); font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
  
  .form-control {
    width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border-light);
    border-radius: 10px; color: #fff; font-size: 12px; outline: none; transition: 0.2s;
  }
  .form-control:focus { border-color: var(--green); background: #070b09; box-shadow: 0 0 12px rgba(0,213,100,0.15); }
  textarea.form-control { resize: vertical; min-height: 90px; }

  .star-rating-wrapper { display: flex; gap: 6px; font-size: 24px; cursor: pointer; margin-top: 6px; }
  .star { color: var(--border-light); transition: 0.2s; }
  .star.selected { color: var(--star); text-shadow: 0 0 10px rgba(255,189,46,0.3); }

  .submit-btn {
    width: 100%; padding: 13px; background: var(--green); color: #000; border: none;
    font-size: 12px; font-weight: 900; border-radius: 10px; cursor: pointer; transition: 0.2s;
    margin-top: 12px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,213,100,0.25);
  }
  .submit-btn:hover { background: var(--green-light); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,213,100,0.35); }

  .back-link { display: inline-block; color: var(--muted); font-size: 11px; font-weight: bold; text-decoration: none; margin-top: 22px; transition: 0.2s; }
  .back-link:hover { color: #fff; }

  .success-msg { display: none; text-align: center; padding: 25px 0; }
  .success-msg h3 { color: var(--green-light); font-size: 18px; margin-bottom: 8px; font-weight: 900; }
  .success-msg p { color: var(--muted); font-size: 12px; margin-bottom: 20px; }

  .preview-box {
    background: var(--surface-soft); border: 1px solid var(--border-light); border-radius: 10px;
    padding: 12px; margin-top: 8px; display: none; font-size: 11px; text-align: left;
  }
</style>
</head>
<body>

<div class="card">
  <div id="formContainer">
    <div class="header-title">SUBMIT YOUR VOUCH</div>
    <div class="header-subtitle">Enter your Order Code to submit a verified review.</div>
    
    <form id="vouchForm" onsubmit="submitVouch(event)">
      <div class="form-group">
        <label>ORDER CODE (E.G. ORD-XXXXXX)</label>
        <input type="text" id="vouchOrderCode" class="form-control" placeholder="Enter your Order Code here" oninput="fetchOrderByCode(this.value)" required>
        <div id="orderPreviewBox" class="preview-box"></div>
      </div>

      <div class="form-group">
        <label>YOUR NAME (OR FACEBOOK NAME)</label>
        <input type="text" id="customerName" class="form-control" placeholder="e.g. John Doe" required>
      </div>

      <div class="form-group">
        <label>GAME OR ITEM PURCHASED</label>
        <select id="vouchGame" class="form-control" required>
          <option value="" disabled selected>Select game category</option>
          <option value="Steal An Egg">Steal An Egg</option>
          <option value="Steal A Brainrot">Steal A Brainrot</option>
          <option value="Blox Fruits">Blox Fruits</option>
          <option value="Minecraft">Minecraft</option>
          <option value="Digital Goods">Digital Goods / Accounts</option>
          <option value="General Shop / Items">General Shop / Items</option>
        </select>
      </div>

      <div class="form-group">
        <label>RATING</label>
        <div class="star-rating-wrapper" id="starContainer">
          <span class="star selected" data-value="1" onclick="setRating(1)">★</span>
          <span class="star selected" data-value="2" onclick="setRating(2)">★</span>
          <span class="star selected" data-value="3" onclick="setRating(3)">★</span>
          <span class="star selected" data-value="4" onclick="setRating(4)">★</span>
          <span class="star selected" data-value="5" onclick="setRating(5)">★</span>
        </div>
        <input type="hidden" id="vouchRating" value="5" required>
      </div>

      <div class="form-group">
        <label>FEEDBACK / MESSAGE</label>
        <textarea id="vouchFeedback" class="form-control" placeholder="Super fast transaction and 100% legit! Account details provided instantly." required></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">VERIFY & SUBMIT VOUCH</button>
    </form>
  </div>

  <div id="successContainer" class="success-msg">
    <h3>Thank you for your Vouch! 🎉</h3>
    <p>Your verified review has been successfully submitted.</p>
    <a href="index.html" class="submit-btn" style="display: block; text-decoration: none; text-align: center; line-height: normal;">BACK TO MARKETPLACE</a>
  </div>

  <div>
    <a href="index.html" class="back-link">← Back to Marketplace</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  let verifiedOrderData = null;

  function setRating(val) {
    document.getElementById('vouchRating').value = val;
    const stars = document.querySelectorAll('.star');
    stars.forEach(star => {
      if(parseInt(star.getAttribute('data-value')) <= val) {
        star.classList.add('selected');
      } else {
        star.classList.remove('selected');
      }
    });
  }

  async function fetchOrderByCode(orderCode) {
    const val = orderCode.trim().toUpperCase();
    const box = document.getElementById('orderPreviewBox');
    const gameSelect = document.getElementById('vouchGame');

    if(!val) {
      box.style.display = 'none';
      box.textContent = '';
      verifiedOrderData = null;
      return;
    }

    try {
      const { data: orderData, error: orderError } = await supabaseClient
        .from('orders')
        .select('*')
        .eq('order_id', val)
        .single();

      if(orderError || !orderData) {
        box.style.display = 'block';
        box.style.color = '#ff5f56';
        box.textContent = '❌ No order found with this code.';
        verifiedOrderData = null;
        return;
      }

      const orderStatus = String(orderData.status || "").trim().toLowerCase();
      if(orderStatus !== 'completed') {
        box.style.display = 'block';
        box.style.color = '#ff5f56';
        box.textContent = `❌ Transaction is not yet completed (Status: ${orderData.status}). Must be 'Completed' before submitting a vouch.`;
        verifiedOrderData = null;
        return;
      }

      const { data: itemData } = await supabaseClient
        .from('accounts')
        .select('*')
        .eq('id', orderData.item_id)
        .single();

      verifiedOrderData = {
        order: orderData,
        item: itemData || {}
      };

      box.style.display = 'block';
      box.style.color = '#00e676';
      box.textContent = `✅ Verified & Completed! Item ID: ${orderData.item_id} (₱${orderData.price})`;
      
      if(orderData.game) {
        for(let i = 0; i < gameSelect.options.length; i++) {
          if(gameSelect.options[i].value.toLowerCase() === orderData.game.toLowerCase()) {
            gameSelect.selectedIndex = i;
            break;
          }
        }
      }
    } catch(err) {
      box.style.display = 'none';
      verifiedOrderData = null;
    }
  }

  async function submitVouch(e) {
    e.preventDefault();
    if(!verifiedOrderData) {
      alert("Please enter a valid and 'Completed' Order Code.");
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.textContent = "VERIFYING...";
    btn.disabled = true;

    try {
      const item = verifiedOrderData.item || {};
      const order = verifiedOrderData.order || {};

      const newVouch = {
        customer_name: document.getElementById('customerName').value.trim(),
        game: document.getElementById('vouchGame').value,
        item_id: order.item_id || item.id || null,
        order_code: order.order_id || document.getElementById('vouchOrderCode').value.trim(),
        rating: parseInt(document.getElementById('vouchRating').value),
        feedback: document.getElementById('vouchFeedback').value.trim(),
        image_url: item.image_url || item.imageUrl || item.image || null,
        price: order.price || item.price || 0,
        money: item.money || item.Money || null,
        money_per_second: item.moneyPerSecond || item.money_per_second || null,
        speed: item.speed || item.Speed || null,
        steals: item.steals || item.Steals || null,
        rebirth: item.rebirth || item.Rebirth || null,
        admin_panel: item.adminpanel || item.adminPanel || item.admin_panel || null,
        level: item.level || item.Level || null,
        bounty: item.bounty || item.Bounty || null,
        fruit: item.fruit || item.Fruit || null,
        fighting_style: item.fightingStyle || item.fighting_style || null,
        race: item.race || item.Race || null,
        mc_access: item.mcAccess || item.mc_access || null,
        mc_platform: item.mcPlatform || item.mc_platform || null,
        mc_rank: item.mcRank || item.mc_rank || null,
        mc_capes: item.mcCapes || item.mc_capes || null,
        status: 'Pending',
        date_added: new Date().toISOString().split('T')[0]
      };

      const { error } = await supabaseClient.from('vouches').insert([newVouch]);
      if (error) throw error;

      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successContainer').style.display = 'block';
    } catch (err) {
      alert("Error submitting vouch: " + err.message);
      btn.textContent = "VERIFY & SUBMIT VOUCH";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
