<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sold History - Digital & Gaming Marketplace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#090909; --surface:#101010; --border:#202020; --text:#f5f5f5;
    --muted:#8b8b8b; --green:#00d564; --green-light:#00e676;
  }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top center, rgba(0,213,100,.04), transparent 30%), var(--bg);
    color: var(--text); min-height: 100vh; padding: 30px 20px;
  }
  .container { width: 100%; max-width: 1180px; margin: 0 auto; }
  .back-link { display: inline-block; color: var(--green-light); font-size: 12px; font-weight: bold; text-decoration: none; margin-bottom: 25px; }
  .back-link:hover { text-decoration: underline; }
  
  .header { text-align: center; margin-bottom: 40px; }
  .header h1 { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 8px; text-transform: uppercase; }
  .header p { color: var(--muted); font-size: 13px; }

  .account-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; }
  
  .account-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 17px; display: flex; flex-direction: column; opacity: 0.85; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 9px; margin-bottom: 12px; }
  .game-badge { max-width: 70%; padding: 5px 8px; background: #181818; border: 1px solid #232323; border-radius: 999px; color: #8e8e8e; font-size: 9px; font-weight: 800; text-transform: uppercase; }
  .sold-out-badge { background: rgba(232,154,36,0.15); border: 1px solid rgba(232,154,36,0.3); color: #e89a24; padding: 5px 8px; border-radius: 999px; font-size: 8px; font-weight: 900; text-transform: uppercase; }
  
  .account-id-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .account-id-label { color: #5e5e5e; font-size: 8px; text-transform: uppercase; }
  .account-id { display: block; color: #fff; font-size: 16px; font-weight: 900; margin-bottom: 11px; word-break: break-all; }
  
  .details-box { margin-bottom: 12px; }
  .detail-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #1d1d1d; font-size: 11px; }
  .detail-label { color: #666; }
  .detail-value { color: #e8e8e8; text-align: right; font-weight: 700; word-break: break-all; }

  .price-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; background: #131313; border: 1px solid #202020; border-radius: 10px; margin-bottom: 12px; margin-top: auto; }
  .price-label { color: #5d5d5d; font-size: 9px; font-weight: 800; }
  .price-value { color: #e89a24; font-size: 16px; font-weight: 900; }

  .status-completed-bar { text-align: center; background: #161616; border: 1px solid #252525; padding: 10px; border-radius: 8px; font-size: 10px; font-weight: 900; color: #e89a24; text-transform: uppercase; }

  @media(max-width: 900px) {
    .account-grid { grid-template-columns: repeat(2,1fr); }
  }
  @media(max-width: 640px) {
    .account-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Back to Marketplace</a>
  
  <div class="header">
    <h1>Sold Items History</h1>
    <p>Listahan ng mga matagumpay na naibentang accounts at items.</p>
  </div>

  <div id="soldAccountGrid" class="account-grid">
    <div style="color: #666; font-size: 12px; grid-column: 1/-1; text-align: center; padding: 30px;">Loading sold history...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  function normalizeGame(game){ return String(game || "").trim().toLowerCase().replace(/\s+/g, " "); }

  function formatPrice(price){
    let value = String(price || "").replace(/₱/g,"").replace(/,/g,"");
    const number = parseFloat(value.replace(/[^0-9.-]/g, ""));
    return isNaN(number) ? "₱0" : "₱" + number.toLocaleString("en-PH");
  }

  function detailRow(label, value){
    if(value === undefined || value === null || String(value).trim() === "") return "";
    return `<div class="detail-row"><span class="detail-label">${escapeHTML(label)}</span><span class="detail-value">${escapeHTML(value)}</span></div>`;
  }

  function escapeHTML(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function createSoldAccountCard(account){
    const game = normalizeGame(account.game);
    let details = "";

    // Sinadya nating HUWAG isama ang username dito para mapanatili ang privacy/konsepto mo
    if(game === "steal an egg"){
      details += detailRow("Money", account.money);
      details += detailRow("Money/s", account.moneyPerSecond);
      details += detailRow("Speed", account.speed);
    } else if(game === "steal a brainrot"){
      details += detailRow("Money", account.money);
      details += detailRow("Steals", account.steals);
      details += detailRow("Rebirth", account.rebirth);
      if(String(account.adminPanel).trim().toLowerCase() === "true") details += detailRow("🛠️ Admin Panel", "TRUE");
      else if(String(account.adminPanel).trim().toLowerCase() === "false") details += detailRow("🛠️ Admin Panel", "FALSE");
    } else if(game === "blox fruits"){
      details += detailRow("Level", account.level);
      details += detailRow("Bounty", account.bounty);
      details += detailRow("Fruit", account.fruit);
      details += detailRow("Fighting Style", account.fightingStyle);
      details += detailRow("Race", account.race);
    } else if(game === "minecraft"){
      details += detailRow("Access", account.mcAccess);
      details += detailRow("Platform", account.mcPlatform);
      details += detailRow("Rank", account.mcRank);
      details += detailRow("Capes / Items", account.mcCapes);
    } else if(game === "digital goods"){
      details += detailRow("Platform", account.dgPlatform);
      details += detailRow("Inclusions", account.dgInclusions);
    }

    const safeGame = escapeHTML(account.game || "Unknown Game");
    const safeId = escapeHTML(account.id || "N/A");

    const imageHtml = account.image_url ? `
      <div style="margin-bottom: 12px; border-radius: 8px; overflow: hidden; height: 140px; background: #151515;">
        <img src="${escapeHTML(account.image_url)}" alt="Screenshot" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
    ` : "";

    return `
      <div class="account-card">
        ${imageHtml}
        <div class="card-top">
          <span class="game-badge">${safeGame}</span>
          <span class="sold-out-badge">SOLD OUT</span>
        </div>
        <div class="account-id-row">
          <span class="account-id-label">ITEM / ACCOUNT ID</span>
        </div>
        <div class="account-id">${safeId}</div>
        <div class="details-box">${details}</div>
        <div class="price-box">
          <span class="price-label">SOLD PRICE</span>
          <span class="price-value">${escapeHTML(formatPrice(account.price))}</span>
        </div>
        <div class="status-completed-bar">🔒 Transaction Completed</div>
      </div>
    `;
  }

  async function loadSoldAccounts(){
    const grid = document.getElementById("soldAccountGrid");
    try {
      const { data, error } = await supabaseClient.from('accounts').select('*');
      if(error) throw error;

      const soldList = (data || []).filter(acc => String(acc.status).toLowerCase() === "sold");

      if(soldList.length === 0){
        grid.innerHTML = `<div style="color: #666; font-size: 12px; grid-column: 1/-1; text-align: center; padding: 30px;">Wala pang naibentang item sa ngayon.</div>`;
        return;
      }

      grid.innerHTML = soldList.map(createSoldAccountCard).join("");
    } catch(err) {
      console.error(err);
      grid.innerHTML = `<div style="color: #ff5f56; font-size: 12px; grid-column: 1/-1; text-align: center; padding: 30px;">May error sa pag-load ng sold history.</div>`;
    }
  }

  loadSoldAccounts();
</script>
</body>
</html>
