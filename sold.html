<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sold History - Roblox Marketplace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #090909; color: #f5f5f5; min-height: 100vh; padding: 20px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 25px; }
  .header h1 { color: #e89a24; font-size: 24px; font-weight: 900; }
  .account-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .account-card { background: #101010; border: 1px solid #202020; border-radius: 12px; padding: 15px; }
  .status-sold { color: #e89a24; font-weight: bold; font-size: 10px; }
  .pagination-container { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 30px; }
  .page-btn { padding: 8px 12px; background: #141414; border: 1px solid #292929; color: #aaa; border-radius: 8px; cursor: pointer; font-size: 11px; }
  .page-btn.active { background: #e89a24; color: #000; font-weight: bold; }
  .page-btn:disabled { opacity: 0.4; }
  .back-link { display: inline-block; margin-bottom: 20px; color: #888; text-decoration: none; font-size: 12px; }
  .back-link:hover { color: #fff; }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Back to Marketplace</a>
  <div class="header">
    <h1>SOLD ITEMS HISTORY</h1>
    <p style="color: #777; font-size: 12px;">Mga naibenta nang accounts at items.</p>
  </div>

  <div id="soldGrid" class="account-grid">
    <div style="color: #666; font-size: 11px;">Loading sold history...</div>
  </div>

  <div id="paginationContainer" class="pagination-container" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const ITEMS_PER_PAGE = 20; // 20 items bawat page
  let currentPage = 1;
  let soldList = [];

  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  async function loadSoldItems() {
    const grid = document.getElementById('soldGrid');
    try {
      const { data, error } = await supabaseClient.from('accounts').select('*').eq('status', 'Sold').order('id', { ascending: false });
      if(error) throw error;

      if(!data || data.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 30px;">No sold items found yet.</div>`;
        return;
      }

      soldList = data;
      renderSoldPage();
    } catch(err) {
      grid.innerHTML = `<div style="color: #ff5f56;">Error loading sold items.</div>`;
    }
  }

  function renderSoldPage() {
    const grid = document.getElementById('soldGrid');
    const paginationContainer = document.getElementById('paginationContainer');
    
    const totalPages = Math.ceil(soldList.length / ITEMS_PER_PAGE);
    if(currentPage > totalPages) currentPage = totalPages || 1;

    const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
    const visibleList = soldList.slice(startIndex, startIndex + ITEMS_PER_PAGE);

    grid.innerHTML = visibleList.map(item => `
      <div class="account-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:10px; color:#777; text-transform:uppercase;">${item.game}</span>
          <span class="status-sold">SOLD</span>
        </div>
        <div style="font-size:14px; font-weight:bold; color:#fff; margin-bottom:5px;">ID: ${item.id}</div>
        <div style="font-size:12px; color:#00d564; font-weight:bold;">₱${item.price}</div>
      </div>
    `).join('');

    if(totalPages > 1){
      paginationContainer.style.display = "flex";
      let html = `<button class="page-btn" onclick="changePage(1)" ${currentPage === 1 ? 'disabled' : ''}>First</button>`;
      for(let i = 1; i <= totalPages; i++) {
        if(i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
        }
      }
      html += `<button class="page-btn" onclick="changePage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>Last</button>`;
      paginationContainer.innerHTML = html;
    } else {
      paginationContainer.style.display = "none";
    }
  }

  function changePage(page) {
    currentPage = page;
    renderSoldPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  loadSoldItems();
</script>
</body>
</html>
