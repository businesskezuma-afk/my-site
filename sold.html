<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sold History - Roblox Marketplace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #090909; color: #f5f5f5; min-height: 100vh; padding: 30px 20px; }
  .container { max-width: 1000px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { color: #e89a24; font-size: 26px; font-weight: 900; margin-bottom: 5px; }
  .header p { color: #8b8b8b; font-size: 12px; }
  
  .back-link { display: inline-block; margin-bottom: 20px; color: #00d564; font-size: 12px; text-decoration: none; font-weight: bold; }
  .back-link:hover { text-decoration: underline; }

  .sold-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
  .sold-card { background: #101010; border: 1px solid #252010; border-radius: 12px; padding: 18px; position: relative; }
  .sold-badge { display: inline-block; padding: 4px 8px; background: rgba(232,154,36,0.1); border: 1px solid rgba(232,154,36,0.3); color: #e89a24; font-size: 9px; font-weight: 900; border-radius: 999px; margin-bottom: 10px; text-transform: uppercase; }
  .sold-id { font-size: 15px; font-weight: 900; color: #fff; margin-bottom: 8px; }
  .sold-details { font-size: 11px; color: #999; margin-bottom: 10px; }
  .sold-price { font-size: 14px; font-weight: 900; color: #e89a24; }
  .spinner { width: 24px; height: 24px; border: 3px solid rgba(232,154,36,0.2); border-top-color: #e89a24; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 40px auto; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Back to Marketplace</a>
  <div class="header">
    <h1>SOLD ITEMS & ACCOUNTS HISTORY</h1>
    <p>List of previously sold items and accounts.</p>
  </div>

  <div id="soldGrid" class="sold-grid">
    <div style="grid-column: 1/-1; text-align: center;"><div class="spinner"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  function escapeHTML(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function formatPrice(price){
    if(!price) return "₱0";
    let value = String(price).trim().replace(/₱/g,"").replace(/,/g,"");
    const number = parseFloat(value.replace(/[^0-9.-]/g, ""));
    if(isNaN(number)) return "₱" + String(price).trim();
    return "₱" + number.toLocaleString("en-PH");
  }

  async function loadSoldHistory() {
    const grid = document.getElementById('soldGrid');
    try {
      const { data, error } = await supabaseClient.from('accounts').select('*').ilike('status', 'Sold');
      if(error) throw error;

      if(!data || data.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #666; font-size: 12px; padding: 40px;">No sold history records found yet.</div>`;
        return;
      }

      grid.innerHTML = data.map(item => `
        <div class="sold-card">
          <span class="sold-badge">📦 SOLD ITEM</span>
          <div class="sold-id">${escapeHTML(item.id)}</div>
          <div class="sold-details">Game: <b>${escapeHTML(item.game)}</b><br>Type: ${escapeHTML(item.listing_type || 'Account')}</div>
          <div class="sold-price">${escapeHTML(formatPrice(item.price))}</div>
        </div>
      `).join('');
    } catch(err) {
      console.error(err);
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ff5f56; font-size: 12px;">Failed to load sold history.</div>`;
    }
  }

  loadSoldHistory();
</script>

</body>
</html>
