<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Customer Reviews & Vouches - Roblox Marketplace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #090909; color: #f5f5f5; min-height: 100vh; padding: 30px 20px; }
  .container { max-width: 1000px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { color: #00d564; font-size: 26px; font-weight: 900; margin-bottom: 5px; }
  .header p { color: #8b8b8b; font-size: 12px; }
  
  .back-link { display: inline-block; margin-bottom: 20px; color: #00d564; font-size: 12px; text-decoration: none; font-weight: bold; }
  .back-link:hover { text-decoration: underline; }

  .reviews-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
  .vouch-card { background: #101010; border: 1px solid #202020; border-radius: 12px; padding: 18px; }
  .vouch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .vouch-name { font-size: 13px; font-weight: 900; color: #fff; }
  .vouch-stars { color: #ffbd2e; font-size: 12px; }
  .vouch-feedback { font-size: 12px; color: #bbb; line-height: 1.5; margin-bottom: 10px; }
  .vouch-game { font-size: 9px; color: #666; text-transform: uppercase; font-weight: bold; }
  .spinner { width: 24px; height: 24px; border: 3px solid rgba(0,213,100,0.2); border-top-color: #00d564; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 40px auto; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Back to Marketplace</a>
  <div class="header">
    <h1>ALL CUSTOMER VOUCHES & REVIEWS</h1>
    <p>Real feedback and ratings from our trusted buyers and traders.</p>
  </div>

  <div id="allReviewsGrid" class="reviews-grid">
    <div style="grid-column: 1/-1; text-align: center;"><div class="spinner"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  function escapeHTML(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  async function loadAllReviews() {
    const grid = document.getElementById('allReviewsGrid');
    try {
      const { data, error } = await supabaseClient.from('vouches').select('*').eq('status', 'Approved').order('date_added', { ascending: false });
      if(error) throw error;

      if(!data || data.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #666; font-size: 12px; padding: 40px;">No approved reviews available yet.</div>`;
        return;
      }

      grid.innerHTML = data.map(v => {
        const stars = "★".repeat(v.rating) + "☆".repeat(5 - v.rating);
        return `
          <div class="vouch-card">
            <div class="vouch-header">
              <span class="vouch-name">${escapeHTML(v.customer_name)}</span>
              <span class="vouch-stars">${stars}</span>
            </div>
            <div class="vouch-feedback">"${escapeHTML(v.feedback)}"</div>
            <div class="vouch-game">${escapeHTML(v.game)} • ${v.date_added || ''}</div>
          </div>
        `;
      }).join('');
    } catch(err) {
      console.error(err);
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ff5f56; font-size: 12px;">Failed to load reviews.</div>`;
    }
  }

  loadAllReviews();
</script>

</body>
</html>
