<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Customer Reviews - Kezrblx Marketplace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #090909; color: #f5f5f5; min-height: 100vh; padding: 30px 20px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .back-link { display: inline-block; color: #00e676; font-size: 11px; font-weight: bold; text-decoration: none; margin-bottom: 25px; }
  .back-link:hover { text-decoration: underline; }
  
  .header { text-align: center; margin-bottom: 35px; }
  .header h1 { color: #00d564; font-size: 24px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
  .header p { color: #888; font-size: 12px; }

  .reviews-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

  .vouch-card { background: #101010; border: 1px solid #202020; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
  
  .item-snapshot { background: #141414; border: 1px solid #222; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  .item-snapshot img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #181818; }
  
  .snapshot-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .game-pill { font-size: 9px; color: #888; font-weight: 900; text-transform: uppercase; background: #1c1c1c; padding: 4px 8px; border-radius: 999px; border: 1px solid #282828; }
  .sold-pill { font-size: 8px; color: #e89a24; font-weight: 900; background: rgba(232,154,36,0.1); padding: 4px 8px; border-radius: 999px; border: 1px solid rgba(232,154,36,0.25); text-transform: uppercase; }

  .snapshot-id-label { font-size: 8px; color: #555; text-transform: uppercase; margin-top: 4px; }
  .snapshot-id { font-size: 15px; font-weight: 900; color: #fff; margin-bottom: 8px; }

  .snapshot-detail-row { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px solid #1a1a1a; }
  .snapshot-detail-label { color: #666; }
  .snapshot-detail-value { color: #ddd; font-weight: bold; }

  .price-row-box { display: flex; justify-content: space-between; align-items: center; background: #121212; border: 1px solid #1f1f1f; padding: 8px 10px; border-radius: 8px; margin-top: 10px; }
  .price-label-text { font-size: 9px; color: #666; font-weight: bold; text-transform: uppercase; }
  .price-value-text { font-size: 14px; color: #00d564; font-weight: 900; }

  .completed-pill { text-align: center; background: rgba(0,213,100,0.06); border: 1px solid rgba(0,213,100,0.2); color: #00e676; font-size: 9px; font-weight: 900; padding: 6px; border-radius: 8px; margin-top: 8px; text-transform: uppercase; }

  .customer-feedback-section { background: #151515; border: 1px solid #222; border-radius: 10px; padding: 12px; margin-top: auto; }
  .feedback-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .customer-name { font-size: 12px; font-weight: 900; color: #fff; }
  .stars { color: #ffbd2e; font-size: 11px; }
  .feedback-text { font-size: 11px; color: #aaa; line-height: 1.4; word-break: break-word; font-style: italic; }
  .feedback-date { font-size: 9px; color: #555; text-align: right; margin-top: 6px; }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Back to Marketplace</a>
  <div class="header">
    <h1>All Customer Reviews</h1>
    <p>All approved vouches from our customers along with the purchased item details.</p>
  </div>

  <div id="reviewsGrid" class="reviews-grid">
    <div style="color: #666; font-size: 12px; grid-column: 1/-1; text-align: center; padding: 40px;">Loading reviews...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  function escapeHTML(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function formatPrice(price){
    let value = String(price || "").replace(/₱/g,"").replace(/,/g,"");
    const number = parseFloat(value.replace(/[^0-9.-]/g, ""));
    return isNaN(number) ? "₱0" : "₱" + number.toLocaleString("en-PH");
  }

  async function loadAllReviews() {
    const grid = document.getElementById('reviewsGrid');
    try {
      const { data, error } = await supabaseClient
        .from('vouches')
        .select('*')
        .eq('status', 'Approved')
        .order('date_added', { ascending: false });

      if (error) throw error;

      if (!data || data.length === 0) {
        grid.innerHTML = `<div style="color: #666; font-size: 12px; grid-column: 1/-1; text-align: center; padding: 40px;">No published reviews or vouches yet.</div>`;
        return;
      }

      grid.innerHTML = data.map(v => {
        let detailsHtml = '';

        if (v.money) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Money</span><span class="snapshot-detail-value">${escapeHTML(v.money)}</span></div>`;
        if (v.money_per_second) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Money/s</span><span class="snapshot-detail-value">${escapeHTML(v.money_per_second)}</span></div>`;
        if (v.speed) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Speed</span><span class="snapshot-detail-value">${escapeHTML(v.speed)}</span></div>`;
        if (v.steals) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Steals</span><span class="snapshot-detail-value">${escapeHTML(v.steals)}</span></div>`;
        if (v.rebirth) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Rebirth</span><span class="snapshot-detail-value">${escapeHTML(v.rebirth)}</span></div>`;
        if (v.admin_panel) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Admin Panel</span><span class="snapshot-detail-value">${escapeHTML(v.admin_panel)}</span></div>`;
        if (v.level) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Level</span><span class="snapshot-detail-value">${escapeHTML(v.level)}</span></div>`;
        if (v.bounty) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Bounty</span><span class="snapshot-detail-value">${escapeHTML(v.bounty)}</span></div>`;
        if (v.fruit) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Fruit</span><span class="snapshot-detail-value">${escapeHTML(v.fruit)}</span></div>`;
        if (v.fighting_style) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Fighting Style</span><span class="snapshot-detail-value">${escapeHTML(v.fighting_style)}</span></div>`;
        if (v.race) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Race</span><span class="snapshot-detail-value">${escapeHTML(v.race)}</span></div>`;
        if (v.mc_access) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Access</span><span class="snapshot-detail-value">${escapeHTML(v.mc_access)}</span></div>`;
        if (v.mc_platform) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Platform</span><span class="snapshot-detail-value">${escapeHTML(v.mc_platform)}</span></div>`;
        if (v.mc_rank) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Rank</span><span class="snapshot-detail-value">${escapeHTML(v.mc_rank)}</span></div>`;
        if (v.mc_capes) detailsHtml += `<div class="snapshot-detail-row"><span class="snapshot-detail-label">Capes</span><span class="snapshot-detail-value">${escapeHTML(v.mc_capes)}</span></div>`;

        const imageTag = v.image_url ? `<img src="${escapeHTML(v.image_url)}" alt="Item Screenshot">` : '';
        const priceText = formatPrice(v.price);
        const itemIdText = v.item_id ? escapeHTML(v.item_id) : (v.order_code ? escapeHTML(v.order_code) : 'N/A');

        return `
          <div class="vouch-card">
            <div>
              <div class="item-snapshot">
                ${imageTag}
                <div class="snapshot-top">
                  <span class="game-pill">${escapeHTML(v.game || 'General')}</span>
                  <span class="sold-pill">SOLD OUT</span>
                </div>
                <div class="snapshot-id-label">Item / Account ID</div>
                <div class="snapshot-id">${itemIdText}</div>
                ${detailsHtml}
                <div class="price-row-box">
                  <span class="price-label-text">Sold Price</span>
                  <span class="price-value-text">${priceText}</span>
                </div>
                <div class="completed-pill">🔒 Transaction Completed</div>
              </div>
            </div>

            <div class="customer-feedback-section">
              <div class="feedback-header">
                <span class="customer-name">${escapeHTML(v.customer_name)}</span>
                <span class="stars">${'★'.repeat(Number(v.rating) || 5)}</span>
              </div>
              <div class="feedback-text">"${escapeHTML(v.feedback)}"</div>
              <div class="feedback-date">${escapeHTML(v.date_added || '')}</div>
            </div>
          </div>
        `;
      }).join('');
    } catch (err) {
      console.error(err);
      grid.innerHTML = `<div style="color: #ff5f56; font-size: 12px; grid-column: 1/-1; text-align: center; padding: 40px;">Error loading reviews.</div>`;
    }
  }

  loadAllReviews();
</script>
</body>
</html>
