<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Customer Reviews - Roblox Marketplace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #090909; color: #f5f5f5; min-height: 100vh; padding: 20px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 25px; }
  .header h1 { color: #00d564; font-size: 24px; font-weight: 900; }
  .vouches-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .vouch-card { background: #101010; border: 1px solid #202020; border-radius: 11px; padding: 15px; }
  .vouch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .vouch-name { font-size: 12px; font-weight: 900; color: #fff; }
  .vouch-stars { color: #ffbd2e; font-size: 11px; }
  .vouch-feedback { font-size: 11px; color: #aaa; line-height: 1.5; margin-bottom: 8px; }
  .vouch-game { font-size: 8px; color: #666; text-transform: uppercase; font-weight: bold; }
  
  .pagination-container { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 30px; }
  .page-btn { padding: 8px 12px; background: #141414; border: 1px solid #292929; color: #aaa; border-radius: 8px; cursor: pointer; font-size: 11px; }
  .page-btn.active { background: #00d564; color: #000; font-weight: bold; }
  .page-btn:disabled { opacity: 0.4; }
  .back-link { display: inline-block; margin-bottom: 20px; color: #888; text-decoration: none; font-size: 12px; }
  .back-link:hover { color: #fff; }

  @media(max-width: 900px) { .vouches-grid { grid-template-columns: repeat(2, 1fr); } }
  @media(max-width: 640px) { .vouches-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Back to Marketplace</a>
  <div class="header">
    <h1>ALL CUSTOMER REVIEWS</h1>
    <p style="color: #777; font-size: 12px;">Lahat ng aprubadong vouch mula sa ating mga customers.</p>
  </div>

  <div id="reviewsGrid" class="vouches-grid">
    <div style="color: #666; font-size: 11px;">Loading reviews...</div>
  </div>

  <div id="paginationContainer" class="pagination-container" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const ITEMS_PER_PAGE = 20; // 20 reviews bawat page
  let currentPage = 1;
  let reviewsList = [];

  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  async function loadAllReviews() {
    const grid = document.getElementById('reviewsGrid');
    try {
      const { data, error } = await supabaseClient.from('vouches').select('*').eq('status', 'Approved').order('date_added', { ascending: false });
      if(error) throw error;

      if(!data || data.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 30px;">No reviews found yet.</div>`;
        return;
      }

      reviewsList = data;
      renderReviewsPage();
    } catch(err) {
      grid.innerHTML = `<div style="color: #ff5f56;">Error loading reviews.</div>`;
    }
  }

  function renderReviewsPage() {
    const grid = document.getElementById('reviewsGrid');
    const paginationContainer = document.getElementById('paginationContainer');
    
    const totalPages = Math.ceil(reviewsList.length / ITEMS_PER_PAGE);
    if(currentPage > totalPages) currentPage = totalPages || 1;

    const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
    const visibleList = reviewsList.slice(startIndex, startIndex + ITEMS_PER_PAGE);

    grid.innerHTML = visibleList.map(v => {
      const stars = "★".repeat(v.rating) + "☆".repeat(5 - v.rating);
      return `
        <div class="vouch-card">
          <div class="vouch-header">
            <span class="vouch-name">${v.customer_name}</span>
            <span class="vouch-stars">${stars}</span>
          </div>
          <div class="vouch-feedback">"${v.feedback}"</div>
          <div class="vouch-game">${v.game} • ${v.date_added || ''}</div>
        </div>
      `;
    }).join('');

    if(totalPages > 1){
      paginationContainer.style.display = "flex";
      let html = `<button class="page-btn" onclick="changePage(1)" ${currentPage === 1 ? 'disabled' : ''}>First</button>`;
      for(let i = 1; i <= totalPages; i++) {
        if(i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
        }
      }
      html += `<button class="page-btn" onclick="changePage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>Last</button>`;
      paginationContainer.innerHTML = html;
    } else {
      paginationContainer.style.display = "none";
    }
  }

  function changePage(page) {
    currentPage = page;
    renderReviewsPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  loadAllReviews();
</script>
</body>
</html>
