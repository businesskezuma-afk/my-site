<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Customer Reviews & Vouches - Roblox Marketplace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #090909; color: #f5f5f5; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 900px; margin: 0 auto; background: #101010; border: 1px solid #202020; border-radius: 12px; padding: 30px; }
  .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid #202020; padding-bottom: 15px; }
  .header h1 { color: #00d564; font-size: 24px; font-weight: 900; }
  .header p { color: #8b8b8b; font-size: 12px; margin-top: 5px; }
  .reviews-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
  .vouch-card { background: #141414; border: 1px solid #222; border-radius: 11px; padding: 15px; }
  .vouch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .vouch-name { font-size: 13px; font-weight: 900; color: #fff; }
  .vouch-stars { color: #ffbd2e; font-size: 12px; }
  .vouch-feedback { font-size: 12px; color: #aaa; line-height: 1.5; margin-bottom: 8px; }
  .vouch-game { font-size: 9px; color: #666; text-transform: uppercase; font-weight: bold; }
  .back-link { display: inline-block; color: #00d564; text-decoration: none; font-size: 12px; font-weight: bold; margin-bottom: 20px; }
  .back-link:hover { text-decoration: underline; }
  .pagination-container { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 20px; flex-wrap: wrap; }
  .page-btn { padding: 6px 12px; background: #181818; border: 1px solid #292929; color: #aaa; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .page-btn:hover { background: #252525; color: #fff; }
  .page-btn.active { background: #00d564; color: #000; border-color: #00d564; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  @media(max-width: 640px) { .reviews-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Bumalik sa Marketplace</a>
  <div class="header">
    <h1>ALL CUSTOMER REVIEWS & VOUCHES</h1>
    <p>Mga patunay at komento mula sa mga lehitimong bumili</p>
  </div>

  <div id="allReviewsGrid" class="reviews-grid">
    <div style="grid-column: 1/-1; text-align: center; color: #666;">Loading reviews...</div>
  </div>

  <div id="reviewsPagination" class="pagination-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  let allReviews = [];
  let currentReviewPage = 1;
  const REVIEWS_PER_PAGE = 6;

  async function loadAllReviews() {
    const { data, error } = await supabaseClient.from('vouches').select('*').eq('status', 'Approved').order('date_added', { ascending: false });
    if(error) {
      document.getElementById('allReviewsGrid').innerHTML = `<div style="color:red; text-align:center; grid-column:1/-1;">Error loading reviews</div>`;
      return;
    }
    allReviews = data || [];
    renderReviewPage();
  }

  function renderReviewPage() {
    const grid = document.getElementById('allReviewsGrid');
    const pagination = document.getElementById('reviewsPagination');

    if(allReviews.length === 0) {
      grid.innerHTML = `<div style="color:#666; text-align:center; grid-column:1/-1;">Walang pang approved na customer reviews.</div>`;
      pagination.innerHTML = "";
      return;
    }

    const totalPages = Math.ceil(allReviews.length / REVIEWS_PER_PAGE);
    if(currentReviewPage > totalPages) currentReviewPage = totalPages;
    if(currentReviewPage < 1) currentReviewPage = 1;

    const startIdx = (currentReviewPage - 1) * REVIEWS_PER_PAGE;
    const pageItems = allReviews.slice(startIdx, startIdx + REVIEWS_PER_PAGE);

    grid.innerHTML = pageItems.map(v => {
      const stars = "★".repeat(v.rating) + "☆".repeat(5 - v.rating);
      return `
        <div class="vouch-card">
          <div class="vouch-header">
            <span class="vouch-name">${escapeHTML(v.customer_name)}</span>
            <span class="vouch-stars">${stars}</span>
          </div>
          <div class="vouch-feedback">"${escapeHTML(v.feedback)}"</div>
          <div class="vouch-game">${escapeHTML(v.game)} • ${v.date_added || ''}</div>
        </div>
      `;
    }).join('');

    let paginationHTML = `
      <button class="page-btn" onclick="changeReviewPage(1)" ${currentReviewPage === 1 ? 'disabled' : ''}>First</button>
      <button class="page-btn" onclick="changeReviewPage(${currentReviewPage - 1})" ${currentReviewPage === 1 ? 'disabled' : ''}>Prev</button>
    `;

    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentReviewPage - 2 && i <= currentReviewPage + 2)) {
        paginationHTML += `<button class="page-btn ${i === currentReviewPage ? 'active' : ''}" onclick="changeReviewPage(${i})">${i}</button>`;
      }
    }

    paginationHTML += `
      <button class="page-btn" onclick="changeReviewPage(${currentReviewPage + 1})" ${currentReviewPage === totalPages ? 'disabled' : ''}>Next</button>
      <button class="page-btn" onclick="changeReviewPage(${totalPages})" ${currentReviewPage === totalPages ? 'disabled' : ''}>Last</button>
    `;

    pagination.innerHTML = paginationHTML;
  }

  function changeReviewPage(page) {
    currentReviewPage = page;
    renderReviewPage();
  }

  function escapeHTML(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  loadAllReviews();
</script>

</body>
</html>
