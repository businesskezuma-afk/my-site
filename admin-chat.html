<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Live Chat Dashboard - Ascend Trading</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', Arial, sans-serif; }
  :root {
    --bg: #050706; --surface: #0a0f0d; --surface-soft: #111814;
    --border: #17221c; --border-light: #22332a; --text: #eef4f0;
    --muted: #7c8f85; --green: #00d564; --green-light: #00e676;
    --green-soft: rgba(0,213,100,.12); --danger: #ff5f56;
  }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .top-bar h2 { color: var(--green-light); font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 15px rgba(0,213,100,0.2); }
  
  .back-btn { 
    display: inline-flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; 
    font-size: 11px; font-weight: 900; background: var(--surface-soft); padding: 10px 16px; 
    border-radius: 10px; border: 1px solid var(--border-light); transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .back-btn:hover { 
    background: var(--green); color: #000; border-color: var(--green); 
    transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,213,100,0.3);
  }

  .main-layout { display: flex; flex: 1; height: calc(100vh - 65px); overflow: hidden; }
  
  .conv-sidebar { width: 340px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px; font-size: 10px; font-weight: 900; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); background: var(--surface-soft); letter-spacing: 0.5px; }
  .conv-list { flex: 1; overflow-y: auto; }
  .conv-item { padding: 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 5px; }
  .conv-item:hover { background: var(--surface-soft); }
  .conv-item.active { background: var(--green-soft); border-left: 3px solid var(--green); }
  .conv-item-top { display: flex; justify-content: space-between; align-items: center; }
  .conv-name { font-weight: 800; font-size: 13px; color: #fff; }
  .status-badge { font-size: 8px; font-weight: 900; padding: 3px 7px; border-radius: 999px; text-transform: uppercase; }
  .status-badge.active { background: rgba(0,213,100,0.15); color: var(--green-light); border: 1px solid rgba(0,213,100,0.3); }
  .status-badge.inactive { background: rgba(255,95,92,0.15); color: var(--danger); border: 1px solid rgba(255,95,92,0.3); }
  .conv-preview { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chat-pane { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .chat-header-info { padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: space-between; }
  
  .delete-conv-btn { background: rgba(255,95,92,0.1); color: var(--danger); border: 1px solid rgba(255,95,92,0.3); padding: 7px 12px; border-radius: 8px; font-size: 10px; font-weight: 900; cursor: pointer; transition: 0.2s; }
  .delete-conv-btn:hover { background: var(--danger); color: #fff; }

  .chat-messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(circle at center, rgba(0,213,100,0.03), transparent 70%), var(--bg); }
  
  .msg-bubble { padding: 12px 16px; border-radius: 12px; max-width: 65%; word-break: break-word; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  .msg-bubble.customer { align-self: flex-start; background: var(--surface-soft); color: var(--text); border: 1px solid var(--border-light); }
  .msg-bubble.admin { align-self: flex-end; background: var(--green); color: #000; font-weight: 700; box-shadow: 0 4px 15px rgba(0,213,100,0.25); }
  .msg-sender { font-size: 8px; display: block; opacity: 0.7; margin-bottom: 4px; text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px; }

  .chat-input-area { padding: 16px 24px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
  .form-control { flex: 1; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border-light); border-radius: 10px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; }
  .form-control:focus { border-color: var(--green); background: #070b09; box-shadow: 0 0 12px rgba(0,213,100,0.15); }
  
  .btn { padding: 12px 22px; background: var(--green); color: #000; border: none; font-weight: 900; border-radius: 10px; cursor: pointer; font-size: 12px; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,213,100,0.25); text-transform: uppercase; }
  .btn:hover { background: var(--green-light); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,213,100,0.35); }

  .empty-chat { text-align: center; color: var(--muted); margin: auto; font-size: 13px; font-weight: bold; }
</style>
</head>
<body>

<div class="top-bar">
  <h2>💬 Live Support Dashboard</h2>
  <a href="admin.html" class="back-btn">
    <span>←</span> Back to Admin Panel
  </a>
</div>

<div class="main-layout">
  <div class="conv-sidebar">
    <div class="sidebar-header">Active Conversations (<span id="convCount">0</span>)</div>
    <div class="conv-list" id="conversationsList">
      <div style="padding: 20px; text-align: center; color: var(--muted); font-size: 12px;">Loading conversations...</div>
    </div>
  </div>

  <div class="chat-pane">
    <div class="chat-header-info" id="chatHeaderTitle">
      Select a conversation on the left
    </div>
    
    <div id="chatMessagesArea" class="chat-messages">
      <div class="empty-chat">No conversation selected. Click on the list on the left to start chatting.</div>
    </div>

    <div class="chat-input-area" id="chatInputArea" style="display: none;">
      <input type="text" id="adminReplyInput" class="form-control" placeholder="Type your reply as Admin..." onkeydown="if(event.key==='Enter') sendAdminMessage()">
      <button class="btn" onclick="sendAdminMessage()">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  let activeConvId = null;
  let activeCustName = '';

  async function loadConversations() {
    const { data, error } = await supabaseClient.from('conversations').select('*').order('updated_at', { ascending: false });
    if(error) {
      console.error("Error loading conversations:", error);
      return;
    }
    
    const listEl = document.getElementById('conversationsList');
    if(!data || data.length === 0) {
      listEl.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--muted); font-size: 12px;">No active conversations.</div>`;
      document.getElementById('convCount').textContent = '0';
      return;
    }

    document.getElementById('convCount').textContent = data.length;
    const now = new Date();

    listEl.innerHTML = data.map(c => {
      // Suriin kung inactive na (lumampas ng 10 minuto ang updated_at)
      const updatedAt = new Date(c.updated_at);
      const diffMinutes = (now - updatedAt) / (1000 * 60);
      const isInactive = diffMinutes > 10;
      const statusText = isInactive ? 'Inactive' : 'Active';
      const statusClass = isInactive ? 'inactive' : 'active';

      return `
        <div class="conv-item ${activeConvId === c.id ? 'active' : ''}" onclick="selectConversation('${c.id}', '${escapeHTML(c.customer_name || 'Customer')}')">
          <div class="conv-item-top">
            <div class="conv-name">${escapeHTML(c.customer_name || 'Customer')}</div>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
          <div class="conv-preview">${escapeHTML(c.last_message || 'No message')}</div>
        </div>
      `;
    }).join('');
  }

  function selectConversation(convId, custName) {
    activeConvId = convId;
    activeCustName = custName;
    document.getElementById('chatInputArea').style.display = 'flex';
    document.getElementById('chatHeaderTitle').innerHTML = `
      <div>Conversation with: <span style="color:var(--green-light); margin-left: 5px;">${custName}</span> <span style="font-size:10px; color:var(--muted); font-weight:normal; margin-left:10px;">ID: ${convId}</span></div>
      <button class="delete-conv-btn" onclick="deleteConversation('${convId}')">🗑️ Delete Conversation</button>
    `;
    loadMessages();
    loadConversations();
  }

  async function deleteConversation(convId) {
    if(!confirm("Are you sure you want to delete this conversation and all its messages?")) return;

    // Burahin muna ang mga messages na naka-link sa conversation na ito
    await supabaseClient.from('messages').delete().eq('conversation_id', convId);
    
    // Sunod na burahin ang mismong conversation
    const { error } = await supabaseClient.from('conversations').delete().eq('id', convId);

    if(error) {
      alert("Error deleting conversation: " + error.message);
      return;
    }

    // I-reset ang view kung ang dinelete ay ang kasalukuyang nakabukas
    if(activeConvId === convId) {
      activeConvId = null;
      activeCustName = '';
      document.getElementById('chatInputArea').style.display = 'none';
      document.getElementById('chatHeaderTitle').innerHTML = 'Select a conversation on the left';
      document.getElementById('chatMessagesArea').innerHTML = `<div class="empty-chat">No conversation selected. Click on the list on the left to start chatting.</div>`;
    }

    loadConversations();
  }

  async function loadMessages() {
    if(!activeConvId) return;
    const { data, error } = await supabaseClient.from('messages').select('*').eq('conversation_id', activeConvId).order('created_at', { ascending: true });
    if(error) {
      console.error("Error loading messages:", error);
      return;
    }

    const area = document.getElementById('chatMessagesArea');
    if(!data || data.length === 0) {
      area.innerHTML = `<div class="empty-chat">No messages in this conversation yet.</div>`;
      return;
    }

    area.innerHTML = data.map(m => `
      <div class="msg-bubble ${m.sender === 'admin' ? 'admin' : 'customer'}">
        <span class="msg-sender">${m.sender === 'admin' ? 'Admin' : activeCustName}</span>
        ${escapeHTML(m.message)}
      </div>
    `).join('');
    area.scrollTop = area.scrollHeight;
  }

  async function sendAdminMessage() {
    const input = document.getElementById('adminReplyInput');
    const msg = input.value.trim();
    if(!msg || !activeConvId) return;

    const { error: msgError } = await supabaseClient.from('messages').insert([{
      conversation_id: activeConvId,
      sender: 'admin',
      message: msg
    }]);

    if(msgError) {
      alert("Error sending message: " + msgError.message);
      return;
    }

    await supabaseClient.from('conversations').update({
      last_message: 'Admin: ' + msg,
      updated_at: new Date()
    }).eq('id', activeConvId);

    input.value = '';
    loadMessages();
    loadConversations();
  }

  function escapeHTML(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  loadConversations();

  // Supabase Realtime Subscription (Instant Sync)
  supabaseClient
    .channel('admin-live-chat')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'conversations' }, () => {
      loadConversations();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      loadConversations();
      if(activeConvId && payload.new.conversation_id === activeConvId) {
        loadMessages();
      }
    })
    .subscribe();

  // Fallback Polling every 4 seconds
  setInterval(() => {
    loadConversations();
    if(activeConvId) loadMessages();
  }, 4000);
</script>
</body>
</html>
