<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Live Chat Dashboard - Ascend Trading</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ff0033' font-family='Arial, sans-serif' font-weight='900' font-size='75'>K</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #090909; color: #f5f5f5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #101010; border-bottom: 1px solid #202020; }
  .top-bar h2 { color: #00d564; font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  
  /* Pinagandang Back Button */
  .back-btn { 
    display: inline-flex; 
    align-items: center; 
    gap: 8px; 
    color: #fff; 
    text-decoration: none; 
    font-size: 11px; 
    font-weight: 900; 
    background: #161616; 
    padding: 9px 16px; 
    border-radius: 8px; 
    border: 1px solid #2e2e2e; 
    transition: all 0.2s ease; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .back-btn:hover { 
    background: #00d564; 
    color: #000; 
    border-color: #00d564; 
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,213,100,0.3);
  }

  .main-layout { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
  
  /* Left Sidebar - Conversations List */
  .conv-sidebar { width: 340px; background: #111; border-right: 1px solid #202020; display: flex; flex-direction: column; }
  .sidebar-header { padding: 15px; font-size: 11px; font-weight: 900; color: #777; text-transform: uppercase; border-bottom: 1px solid #1c1c1c; background: #141414; }
  .conv-list { flex: 1; overflow-y: auto; }
  .conv-item { padding: 16px; border-bottom: 1px solid #181818; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 4px; }
  .conv-item:hover { background: #161616; }
  .conv-item.active { background: rgba(0,213,100,0.08); border-left: 3px solid #00d564; }
  .conv-name { font-weight: bold; font-size: 13px; color: #fff; }
  .conv-preview { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Center Chat Pane */
  .chat-pane { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }
  .chat-header-info { padding: 15px 20px; background: #121212; border-bottom: 1px solid #202020; font-size: 13px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: space-between; }
  
  .chat-messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: radial-gradient(circle at center, rgba(0,213,100,0.02), transparent 70%), #0d0d0d; }
  
  .msg-bubble { padding: 12px 16px; border-radius: 10px; max-width: 65%; word-break: break-word; font-size: 12px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .msg-bubble.customer { align-self: flex-start; background: #181818; color: #eee; border: 1px solid #252525; }
  .msg-bubble.admin { align-self: flex-end; background: #00d564; color: #000; font-weight: 600; }
  .msg-sender { font-size: 8px; display: block; opacity: 0.7; margin-bottom: 3px; text-transform: uppercase; font-weight: 900; }

  .chat-input-area { padding: 15px 20px; background: #121212; border-top: 1px solid #202020; display: flex; gap: 10px; align-items: center; }
  .form-control { flex: 1; padding: 12px 15px; background: #181818; border: 1px solid #282828; border-radius: 8px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; }
  .form-control:focus { border-color: #00d564; background: #141414; }
  
  .btn { padding: 12px 20px; background: #00d564; color: #000; border: none; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.2s; }
  .btn:hover { background: #00e676; }

  .empty-chat { text-align: center; color: #666; margin: auto; font-size: 13px; font-weight: bold; }
</style>
</head>
<body>

<div class="top-bar">
  <h2>💬 Live Support Dashboard</h2>
  <a href="admin.html" class="back-btn">
    <span>←</span> Back to Admin Panel
  </a>
</div>

<div class="main-layout">
  <!-- Conversations Sidebar on the Left -->
  <div class="conv-sidebar">
    <div class="sidebar-header">Active Conversations (<span id="convCount">0</span>)</div>
    <div class="conv-list" id="conversationsList">
      <div style="padding: 20px; text-align: center; color: #666; font-size: 12px;">Loading conversations...</div>
    </div>
  </div>

  <!-- Chat Window in the Center -->
  <div class="chat-pane">
    <div class="chat-header-info" id="chatHeaderTitle">
      Select a conversation on the left
    </div>
    
    <div id="chatMessagesArea" class="chat-messages">
      <div class="empty-chat">No conversation selected. Click on the list on the left to start chatting.</div>
    </div>

    <div class="chat-input-area" id="chatInputArea" style="display: none;">
      <input type="text" id="adminReplyInput" class="form-control" placeholder="Type your reply as Admin..." onkeydown="if(event.key==='Enter') sendAdminMessage()">
      <button class="btn" onclick="sendAdminMessage()">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseUrl = 'https://ytrtivbepvpjbgdtuqrt.supabase.co';
  const supabaseKey = 'sb_publishable_qWOJctjWQouOqSzjek73pw_FYz7MbyS';
  const supabaseClient = createClient(supabaseUrl, supabaseKey);

  let activeConvId = null;
  let activeCustName = '';

  async function loadConversations() {
    const { data } = await supabaseClient.from('conversations').select('*').order('updated_at', { ascending: false });
    const listEl = document.getElementById('conversationsList');
    
    if(!data || data.length === 0) {
      listEl.innerHTML = `<div style="padding: 20px; text-align: center; color: #666; font-size: 12px;">No active conversations.</div>`;
      document.getElementById('convCount').textContent = '0';
      return;
    }

    document.getElementById('convCount').textContent = data.length;
    listEl.innerHTML = data.map(c => `
      <div class="conv-item ${activeConvId === c.id ? 'active' : ''}" onclick="selectConversation('${c.id}', '${escapeHTML(c.customer_name)}')">
        <div class="conv-name">${escapeHTML(c.customer_name)}</div>
        <div class="conv-preview">${escapeHTML(c.last_message || 'No message')}</div>
      </div>
    `).join('');
  }

  function selectConversation(convId, custName) {
    activeConvId = convId;
    activeCustName = custName;
    document.getElementById('chatInputArea').style.display = 'flex';
    document.getElementById('chatHeaderTitle').innerHTML = `Conversation with: <span style="color:#00d564; margin-left: 5px;">${custName}</span> <span style="font-size:10px; color:#666; font-weight:normal; margin-left:10px;">ID: ${convId}</span>`;
    loadMessages();
    loadConversations();
  }

  async function loadMessages() {
    if(!activeConvId) return;
    const { data } = await supabaseClient.from('messages').select('*').eq('conversation_id', activeConvId).order('created_at', { ascending: true });
    const area = document.getElementById('chatMessagesArea');
    
    if(!data || data.length === 0) {
      area.innerHTML = `<div class="empty-chat">No messages in this conversation yet.</div>`;
      return;
    }

    area.innerHTML = data.map(m => `
      <div class="msg-bubble ${m.sender === 'admin' ? 'admin' : 'customer'}">
        <span class="msg-sender">${m.sender === 'admin' ? 'Admin' : activeCustName}</span>
        ${escapeHTML(m.message)}
      </div>
    `).join('');
    area.scrollTop = area.scrollHeight;
  }

  async function sendAdminMessage() {
    const input = document.getElementById('adminReplyInput');
    const msg = input.value.trim();
    if(!msg || !activeConvId) return;

    await supabaseClient.from('messages').insert([{
      conversation_id: activeConvId,
      sender: 'admin',
      message: msg
    }]);

    await supabaseClient.from('conversations').update({
      last_message: 'Admin: ' + msg,
      updated_at: new Date()
    }).eq('id', activeConvId);

    input.value = '';
    loadMessages();
    loadConversations();
  }

  function escapeHTML(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  loadConversations();
  setInterval(() => {
    loadConversations();
    if(activeConvId) loadMessages();
  }, 4000);
</script>
</body>
</html>
